[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "patchrook-agent"
version = "0.1.0"
description = "A local coding agent with evidence-based model routing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "build>=1.2",
]

[project.scripts]
patchrook-agent = "patchrook_agent.cli:main"

[project.urls]
Repository = "https://github.com/YasinIsse/patchrook-agent"
Issues = "https://github.com/YasinIsse/patchrook-agent/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["patchrook_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
